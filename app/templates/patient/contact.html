<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/contact.css') }}">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900">

  <div class="flex items-center min-h-screen">
    <div class="container mx-auto px-4">
      
      <div class="form-wrapper max-w-xl mx-auto my-10 p-6 rounded-md shadow-sm">

        <!-- Close Button -->
        <a href="{{ url_for('patient.dashboard') }}"
           class="close-btn"
           title="Close & Go Home">
          &times;
        </a>

        <!-- Header -->
        <div class="text-center mb-6">
          <h1 class="form-title text-3xl font-semibold text-gray-700 dark:text-gray-200">
            Contact Us
          </h1>
          <p class="text-gray-400 dark:text-gray-400">
            Fill up the form below to send us a message.
          </p>
        </div>

        <!-- Form -->
        <form action="https://api.web3forms.com/submit" method="POST" id="form">
          
          <input type="hidden" name="access_key" value="252cde03-de20-4dae-bda6-a87bfe16d542">
          <input type="hidden" name="subject" value="New Feedback">
          <input type="checkbox" name="botcheck" class="hidden">

          <!-- Name -->
          <div class="flex flex-wrap mb-5 -mx-2">
            <div class="w-full md:w-1/2 px-2 mb-4 md:mb-0">
              <label class="label" for="first_name">First Name</label>
              <input class="input" type="text" id="first_name" name="name" placeholder="John" required>
            </div>

            <div class="w-full md:w-1/2 px-2">
              <label class="label" for="last_name">Last Name</label>
              <input class="input" type="text" id="last_name" name="last_name" placeholder="Doe" required>
            </div>
          </div>

          <!-- Contact -->
          <div class="flex flex-wrap mb-5 -mx-2">
            <div class="w-full md:w-1/2 px-2 mb-4 md:mb-0">
              <label class="label" for="email">Email Address</label>
              <input class="input" type="email" id="email" name="email" placeholder="you@name.com" required>
            </div>

            <div class="w-full md:w-1/2 px-2">
              <label class="label" for="phone">Phone Number</label>
              <input class="input" type="text" id="phone" name="phone" placeholder="+94 71 239 5679" required>
            </div>
          </div>

          <!-- Message -->
          <div class="mb-5">
            <label class="label" for="message">Your Message</label>
            <textarea class="input" rows="5" id="message" name="message" placeholder="Your message..." required></textarea>
          </div>

          <!-- Submit -->
          <div class="mb-4">
            <button type="submit" class="submit-button">
              Send Message
            </button>
          </div>

          <p id="result" class="text-center text-sm text-gray-400"></p>

        </form>

      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='js/contact.js') }}"></script>

</body>
</html>
