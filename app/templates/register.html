<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form - MediFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>

  <div class="form-container">
    <div class="form-top">
      <a href="{% if current_user.role|lower == 'admin' %}
                  {{ url_for('admin.dashboard') }}
                {% elif current_user.role|lower == 'nurse' %}
                  {{ url_for('nurse.dashboard') }}
                {% endif %}" class="back-link">
        &#8592; Back to Dashboard
      </a>
    </div>

    <div class="header">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="MEDIFLOW Logo" class="logo" />
      <div class="header-text">
        <h2 class="form-title">Registration Form</h2>
        <p class="form-subtitle">Maharagama Apeksha Hospital</p>
      </div>
    </div>

    <form method="POST" action="{{ url_for('admin.register_user') }}">
      <!-- Account Info -->
    <h3 class="section-title">Account Information</h3> <div class="form-group">
       <label for="role">Role <span>*</span></label> 
       <select id="role" name="role" required> 
        {% if current_user.role|lower == 'nurse' %} 
        <option value="patient">Patient</option> 
        {% elif current_user.role|lower == 'admin' %} 
        <option value="doctor">Doctor</option>
         <option value="nurse">Nurse</option> 
         <option value="admin">Admin</option> 
         <option value="patient">Patient</option>
          {% elif current_user.role|lower == 'doctor' %} 
          <option value="doctor">Doctor</option> 
          {% endif %} 
        </select> 
      </div>
      
      <div class="form-group">
        <label for="username">Username <span>*</span></label>
        <input type="text" id="username" name="username" placeholder="Enter username" required>
      </div>

      <div class="form-group">
        <label for="password">Password <span>*</span></label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
      </div>

      <!-- Personal Info -->
      <h3 class="section-title">Personal Information</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="first_name">First Name <span>*</span></label>
          <input type="text" id="first_name" name="first_name" placeholder="First Name" required>
        </div>
        <div class="form-group">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" placeholder="Last Name">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="gender">Gender <span>*</span></label>
          <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label for="date_of_birth">Date of Birth <span>*</span></label>
          <input type="date" id="date_of_birth" name="date_of_birth" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="marital_status">Marital Status <span>*</span></label>
          <select id="marital_status" name="marital_status" required>
            <option value="">Select</option>
            <option value="single">Single</option>
            <option value="married">Married</option>
          </select>
        </div>
        <div class="form-group">
          <label for="nic">NIC <span>*</span></label>
          <input type="text" id="nic" name="nic" required>
        </div>
      </div>

      <!-- Contact Info -->
      <h3 class="section-title">Contact Information</h3>
      <div class="form-group">
        <label for="phone">Phone <span>*</span></label>
        <input type="tel" id="phone" name="phone" required>
      </div>

      <div class="form-group">
        <label for="email">Email <span>*</span></label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="emergency_contact_name">Emergency Contact Name</label>
          <input type="text" id="emergency_contact_name" name="emergency_contact_name">
        </div>
        <div class="form-group">
          <label for="emergency_contact_phone">Emergency Phone</label>
          <input type="tel" id="emergency_contact_phone" name="emergency_contact_phone">
        </div>
      </div>

      <!-- Patient Section -->
      <div id="medical-info" style="display: none;">
        <h3 class="section-title">Medical Information</h3>
        <div class="form-group">
          <label for="disease">Disease</label>
          <select id="disease" name="disease">
            <option value="">Loading diseases...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="disease_description">Disease Description</label>
          <textarea id="disease_description" name="disease_description"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="blood">Blood Type</label>
            <input type="text" id="blood" name="blood">
          </div>
          <div class="form-group">
            <label for="treatment_status">Treatment Status</label>
            <select id="treatment_status" name="treatment_status">
              <option value="Not Started">Not Started</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="appointment_date">Next Appointment Date</label>
          <input type="date" id="appointment_date" name="appointment_date">
        </div>
      </div>

      <!-- Doctor Section -->
      <div id="doctor-info" style="display: none;">
        <h3 class="section-title">Doctor Information</h3>
        <div class="form-group">
          <label for="specialization">Specialization <span>*</span></label>
          <input type="text" id="specialization" name="specialization">
        </div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="submit" class="btn-submit">Register</button>
        <button type="button" class="btn-reset" onclick="resetForm()">Reset</button>
      </div>
    </form>
  </div>

  <!-- Main Script -->
  <script src="{{ url_for('static', filename='js/registerpatient.js') }}"></script>
</body>
</html>
