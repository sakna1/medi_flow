<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Hospital Notification - MediFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/updates.css') }}">
</head>
<body>
  <div class="form-wrapper">
    <!-- Close button -->
    <a href="{{ url_for(current_user.role.lower() + '.dashboard') }}" 
       class="close-btn" 
       title="Close & Go Home">&times;</a>

    <!-- Main Form Container -->
    <div class="container">
      <h3>Add Hospital Notification</h3>

      <form method="POST" action="{{ url_for('nurse.create_notification') }}">
        
        <!-- Notification Type -->
        <div class="mb-3">
          <label for="type" class="form-label">Notification Type</label>
          <select id="type" name="type" class="form-control" required>
            <option value="general">General (All Patients)</option>
            <option value="patient">Patient Specific</option>
          </select>
        </div>

        <!-- Patient ID (hidden unless 'patient' selected) -->
        <div class="mb-3 hidden" id="patientField">
          <label for="patient_id" class="form-label">Patient ID</label>
          <input type="number" class="form-control" id="patient_id" name="patient_id" placeholder="Enter patient ID">
        </div>

        <!-- Update Message -->
        <div class="mb-3">
          <label for="updates" class="form-label">Notification Message</label>
          <textarea class="form-control" id="updates" name="updates" rows="3" required></textarea>
        </div>

        <!-- Date -->
        <div class="mb-3">
          <label for="date" class="form-label">Date</label>
          <input type="date" class="form-control" id="date" name="date" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">Add Notification</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/update_notification.js') }}"></script>
</body>
</html>
