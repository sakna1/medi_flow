<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mediflow Dashboard</title>

  <!-- CSS -->
 <link rel="stylesheet" href="{{ url_for('static', filename='css/doctordashboard.css') }}">
   <link rel="stylesheet" href="{{ url_for('static', filename='css/editprofile.css') }}">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

  <!-- Background Blur Layer -->
  <div class="bg-blur"></div>

  <!-- Page Wrapper START -->
  <div class="page-wrapper">

    <!-- Top Info Bar -->
    <div class="top-info-bar">
      <div class="top-bar-content">
        <div class="logo">
          <img src="../static/img/logonew.png" alt="Mediflow Logo">
        </div>
        <div class="info-row">
          <div class="info-item">
            <i class="bi bi-telephone-fill"></i>
            <div><strong>Emergency</strong><br>(+94) 11 275 5623</div>
          </div>
          <div class="info-item">
            <i class="bi bi-clock-fill"></i>
            <div><strong>Work Hours</strong><br>06:30 AM - 2:00 PM (Weekdays)</div>
          </div>
          <div class="info-item">
            <i class="bi bi-geo-alt-fill"></i>
            <div><strong>Location</strong><br>Maharagama</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">
      <ul class="navbar-nav">
        <li><a href="{{ url_for('nurse.dashboard')}}">Home</a></li>              
        <li><a href="{{ url_for('nurse.editprofile')}}">Patient Profile</a></li>
        <div class="d-flex align-items-center text-white hello-patient">
          <div id="popupContainer">
      <a href="#" id="openFormBtn">Hello Nurse {{ nurse_name }} </a>
      <div id="popupBox" class="popup-box">
        <h3>Account</h3>
        <form>          
         <div><label><a href="{{ url_for('auth.logout')}}">Logout</a></label></div>
        </form>
      </div>    
          <i class="bi bi-person-circle fs-5"></i>
        </div>
      </ul>    
    </nav>
     <div id="popupOverlay"></div>
    <main class="container">
    <!-- Search -->
    <section class="search-box">
      <label>Patient Name</label>
      <input type="text" name="patient_name" id="patient_name">
      <label>Patient ID</label>
      <input type="text" name="patient_id" id="patient_id">
      <button id="search-btn" type="button">Search</button>
    </section>
    </main>

  <section class="personal-info-card">
  <div class="card-header">Personal Info</div>
  <div class="card-body">
    <div class="form-row">
      <label>Patient Id</label>
      <input type="text" id="patientid"/>
      <label>Date of Birth</label>
      <input type="date" id="dob"  />
    </div>
    <div class="form-row">
      <label>First Name</label>
      <input type="text" id="firstname" />
      <label>Marital Status</label>
      <input type="text" id="maritalstatus"/>
    </div>
    <div class="form-row">
      <label>Last Name</label>
      <input type="text" id="lastname"/>
      <label>Email</label>
      <input type="email" id="email"/>
    </div>
    <div class="form-row">
      <label>Gender</label>
      <input type="text" id="gender"/>
      <label>Address</label>
      <input type="text" id="address"/>
    </div>
    <div class="form-row">
      <label>NIC</label>
      <input type="text" id="nic"/>
      <label>Contact Number</label>
      <input type="text" id="phone"/>
    </div>
    <div class="save-btn-wrapper">
     <button type="button" class="save-btn" onclick="savePatient()">Save</button>
    </div>
  </div>
</section>
<!-- Reports Card -->
<section class="card-section">
  <div class="card-header">Reports</div>
  <div class="card-body report-list" id="reportSection">
    <!-- Reports will load here via JS -->
  </div>
  <div class="save-btn-wrapper">
    <input type="file" id="reportFile" style="display:none"/>
    <button class="save-btn" onclick="document.getElementById('reportFile').click()">Add files</button> 
  </div>
</section>
</div> <!-- END Page Wrapper -->
  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-left">
        &copy; 2025 Mediflow. All rights reserved.
      </div>
      <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>        
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/file_upload.js') }}"></script>   
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>  
</body>
</html>
